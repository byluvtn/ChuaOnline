services:
  - type: web
    name: chuaonline
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # Player DB lives on Turso (libSQL), not on the ephemeral Render disk.
      # Set both values in the Render dashboard; if unset, the server falls back to a local file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
