services:
  - type: web
    name: chuaonline
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Node >= 22.13 is required: node:sqlite is only exposed by default from this version on.
      - key: NODE_VERSION
        value: 22.14.0
      # Free plan has no persistent disk: the SQLite file lives in the project dir and resets on
      # each deploy. Attach a disk (paid) and set DB_FILE=/var/data/chuaonline.db to keep data.
