# ChuaOnline on Fly.io — temporary host while Oracle A1.Flex has no capacity.
# Cost target: bill < $5/month so Fly waives it ($0).
#   Machine shared-cpu-1x 512MB in Singapore (sin): ~$3.88/mo
#   Volume 1 GB for local SQLite: $0.15/mo
#   Egress Asia-Pacific: $0.04/GB (Render Nov usage was ~6.8 GB -> ~$0.27)
#   Typical total ~$4.30/mo -> waived -> $0.
# Do NOT allocate a dedicated IPv4 ($2/mo) — the shared Anycast IPv4 is free.
# May len 512MB theo quyet dinh cua user 16/11 22:36 (may 256MB tac lien tuc toi 16/11).
# Khong ha xuong 256MB neu khong co lenh moi tu user.
app = "chua247"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Local SQLite on the volume (no Turso vars set -> server falls back to file).
  DB_FILE = "/data/chuaonline.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    # 10s thay vi 5s: DB treo co the lam process dap cham; sua goc la timeout Turso + circuit breaker, day chi giam bao dong gia
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "chua_data"
  destination = "/data"
