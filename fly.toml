# ChuaOnline on Fly.io — temporary host while Oracle A1.Flex has no capacity.
# Cost target: bill < $5/month so Fly waives it ($0).
#   Machine shared-cpu-1x 256MB in Singapore (sin): ~$2.78/mo
#   Volume 1 GB for local SQLite: $0.15/mo
#   Egress Asia-Pacific: $0.04/GB (Render Nov usage was ~6.8 GB -> ~$0.27)
#   Typical total ~$3.20/mo -> waived -> $0.
# Do NOT allocate a dedicated IPv4 ($2/mo) — the shared Anycast IPv4 is free.
# Do NOT raise the machine size: 256MB is the budget. If the server OOMs,
# stop and report instead of upgrading.
app = "chua247"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Local SQLite on the volume (no Turso vars set -> server falls back to file).
  DB_FILE = "/data/chuaonline.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "chua_data"
  destination = "/data"
